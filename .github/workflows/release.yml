name: Build and Release Plugin

# - Pushing a tag `vX.Y.Z` publishes a release with one zip per supported
#   OpenSearch Dashboards version (.github/supported-osd.json), named
#   <id>-X.Y.Z-osd<A.B.C>.zip. The tag must match the plugin version in
#   package.json and opensearch_dashboards.json, and CHANGELOG.md must have a
#   `## [vX.Y.Z]` section.
# - Pull requests and manual runs only build (pull requests: the version the
#   manifest targets; manual runs: that one or the `osd_version` input).
# - The weekly osd-compat workflow later adds zips for newer Dashboards
#   versions to the latest release.

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      osd_version:
        description: 'OpenSearch Dashboards version to build (X.Y.Z). Defaults to the version in the manifest.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
      primary_osd: ${{ steps.plan.outputs.primary_osd }}
      release_tag: ${{ steps.plan.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test release scripts
        run: .github/scripts/test.sh

      # Inputs and refs are read from environment variables, never
      # interpolated into the script, and validated before use.
      - name: Plan builds
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_OSD_VERSION: ${{ inputs.osd_version }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          SEMVER_RE='^[0-9]+\.[0-9]+\.[0-9]+$'
          TAG_RE='^v([0-9]+\.[0-9]+\.[0-9]+)$'

          MANIFEST_OSD=$(jq -r '.opensearchDashboardsVersion' opensearch_dashboards.json)
          MANIFEST_VERSION=$(jq -r '.version' opensearch_dashboards.json)
          PACKAGE_VERSION=$(jq -r '.version' package.json)

          [[ "$MANIFEST_OSD" =~ $SEMVER_RE ]] || fail "opensearchDashboardsVersion '$MANIFEST_OSD' is not X.Y.Z"
          [[ "$MANIFEST_VERSION" =~ $SEMVER_RE ]] || fail "manifest version '$MANIFEST_VERSION' is not X.Y.Z"
          [ "$MANIFEST_VERSION" = "$PACKAGE_VERSION" ] || fail "opensearch_dashboards.json version ($MANIFEST_VERSION) and package.json version ($PACKAGE_VERSION) differ"

          RELEASE_TAG=""
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            [[ "$REF_NAME" =~ $TAG_RE ]] || fail "release tag '$REF_NAME' must look like v1.2.0 (the Dashboards version is no longer part of the tag)"
            [ "${BASH_REMATCH[1]}" = "$MANIFEST_VERSION" ] || fail "tag version ${BASH_REMATCH[1]} does not match plugin version $MANIFEST_VERSION"
            grep -qF "## [$REF_NAME]" CHANGELOG.md || fail "CHANGELOG.md has no '## [$REF_NAME]' section"
            RELEASE_TAG="$REF_NAME"

            VERSIONS=$(.github/scripts/supported-osd-versions.sh)
            jq -e --arg v "$MANIFEST_OSD" 'index($v) != null' <<< "$VERSIONS" > /dev/null \
              || fail "the manifest targets Dashboards $MANIFEST_OSD, which is not in the supported list $VERSIONS"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_OSD_VERSION" ]; then
            [[ "$INPUT_OSD_VERSION" =~ $SEMVER_RE ]] || fail "osd_version '$INPUT_OSD_VERSION' is not X.Y.Z"
            VERSIONS=$(jq -nc --arg v "$INPUT_OSD_VERSION" '[$v]')
          else
            VERSIONS=$(jq -nc --arg v "$MANIFEST_OSD" '[$v]')
          fi

          {
            echo "versions=$VERSIONS"
            echo "primary_osd=$MANIFEST_OSD"
            echo "release_tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Building for Dashboards: $VERSIONS (release tag: '${RELEASE_TAG:-none}')"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        osd_version: ${{ fromJSON(needs.plan.outputs.versions) }}
    uses: ./.github/workflows/build-plugin.yml
    with:
      osd_version: ${{ matrix.osd_version }}

  release:
    needs: [plan, build]
    # Publish whatever built successfully: a Dashboards version that does not
    # compile must not block the others. The version the manifest targets is
    # required.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-assets
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          merge-multiple: true
          path: dist

      - name: Check build results
        env:
          VERSIONS: ${{ needs.plan.outputs.versions }}
          PRIMARY_OSD: ${{ needs.plan.outputs.primary_osd }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ID=$(jq -r '.id' opensearch_dashboards.json)
          PV=$(jq -r '.version' opensearch_dashboards.json)

          [ -f "dist/$ID-$PV-osd$PRIMARY_OSD.zip" ] || { echo "::error::no build for Dashboards $PRIMARY_OSD, the version the manifest targets"; exit 1; }

          for v in $(jq -r '.[]' <<< "$VERSIONS"); do
            [ -f "dist/$ID-$PV-osd$v.zip" ] || echo "::warning::no build for Dashboards $v; it is not attached to the release (the weekly osd-compat workflow retries it)"
          done
          ls -l dist

      - name: Extract release notes
        env:
          TAG: ${{ needs.plan.outputs.release_tag }}
        run: |
          set -euo pipefail
          ID=$(jq -r '.id' opensearch_dashboards.json)
          PV=$(jq -r '.version' opensearch_dashboards.json)
          awk -v tag="$TAG" '
            index($0, "## [" tag "]") == 1 { found=1; next }
            found && (/^## \[/ || /^\[/) { exit }
            found { print }
          ' CHANGELOG.md > changelog_section.md
          [ -s changelog_section.md ] || { echo "::error::CHANGELOG.md section for $TAG is empty"; exit 1; }
          ASSETS=$(ls dist) PLUGIN_ID="$ID" PLUGIN_VERSION="$PV" \
            .github/scripts/render-compat-notes.sh < changelog_section.md > release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
          body_path: release_notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
